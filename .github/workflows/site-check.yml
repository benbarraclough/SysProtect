name: Site checks

on:
  push:
    branches:
      - main
      - 'redesign/**'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify site links, content and metadata
        run: python scripts/check_site.py
